name: Deploy to GitHub Pages

on:
  push:
    branches: [ Ionut-Gardu ]  
  pull_request:
    branches: [ Ionut-Gardu ] 
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write


concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  nightly-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests with coverage
        id: test_run
        run: |
          npm test -- --watch=false --browsers=ChromeHeadless --code-coverage > test_results.txt 2>&1
          echo "test_exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
        
      - name: Parse individual test results
        id: parse_results
        run: |
          if [ -f test_results.txt ]; then
            # Display the test output for debugging
            echo "=== Test output content ==="
            cat test_results.txt
            echo "=== End of test output ==="
            
            # Parse individual test results
            echo "=== Parsing individual test results ==="
            
            # Create detailed test report
            INDIVIDUAL_TESTS=""
            PASSED_TEST_DETAILS=""
            FAILED_TEST_DETAILS=""
            SKIPPED_TEST_DETAILS=""
            
            # Extract Chrome execution line with test results
            CHROME_RESULT=$(grep "Chrome.*SUCCESS\|Chrome.*FAILED" test_results.txt | tail -1)
            echo "Chrome result line: $CHROME_RESULT"
            
            # Get overall summary from the TOTAL line first
            TOTAL_TESTS=$(grep -E "TOTAL:.*SUCCESS" test_results.txt | tail -1 | grep -oE "[0-9]+" | head -1)
            if [ -z "$TOTAL_TESTS" ] || [ "$TOTAL_TESTS" = "" ]; then
              # Fallback to Chrome execution line
              TOTAL_TESTS=$(echo "$CHROME_RESULT" | grep -oE "Executed [0-9]+" | grep -oE "[0-9]+")
            fi
            
            # Ensure TOTAL_TESTS is a number
            if ! [[ "$TOTAL_TESTS" =~ ^[0-9]+$ ]]; then
              TOTAL_TESTS="0"
            fi
            
            # Count failures - look for explicit FAILED mentions first
            FAILED_TESTS=$(echo "$CHROME_RESULT" | grep -oE "[0-9]+ FAILED" | grep -oE "[0-9]+")
            if [ -z "$FAILED_TESTS" ] || [ "$FAILED_TESTS" = "" ]; then
              # Count actual FAILED test specs
              FAILED_TESTS=$(grep -cE "FAILED.*spec\.ts|✗.*spec\.ts|×.*spec\.ts" test_results.txt || echo "0")
            fi
            
            # Ensure FAILED_TESTS is a number
            if ! [[ "$FAILED_TESTS" =~ ^[0-9]+$ ]]; then
              FAILED_TESTS="0"
            fi
            
            # Safe arithmetic calculation
            PASSED_TESTS=$((TOTAL_TESTS - FAILED_TESTS))
            if [ $PASSED_TESTS -lt 0 ]; then
              PASSED_TESTS=0
            fi
            
            # Parse individual test files and their results
            echo "Extracting individual test information..."
            echo "Total: $TOTAL_TESTS, Failed: $FAILED_TESTS, Passed: $PASSED_TESTS"
            
            # Extract individual test cases and their status
            # Look for test descriptions in the output (Jasmine/Karma format)
            INDIVIDUAL_TESTS="📊 **Individual Test Results:**"
            
            # Method 1: Look for test execution patterns in Chrome output
            # Extract lines that show individual test execution
            TEST_EXECUTION_LINES=$(grep -E "Chrome.*Executed [0-9]+ of [0-9]+" test_results.txt)
            
            # Method 2: Look for spec file execution and test descriptions
            # Find test descriptions that typically appear in Angular/Jasmine output
            TEST_DESCRIPTIONS=$(grep -E "should |it\('|describe\(" test_results.txt | head -50 || echo "")
            
            # Method 3: Parse console output for individual test results
            # Look for test names in error messages and logs
            INDIVIDUAL_TEST_NAMES=""
            
            # Extract test names from spec files (assuming standard naming)
            SPEC_TESTS=$(grep -oE "(should [^'\"]+|it\(['\"][^'\"]*['\"])" test_results.txt | head -30 | sed 's/it([\x27\x22]//g' | sed 's/[\x27\x22].*//g' || echo "")
            
            # Parse individual test results from Chrome execution
            if [ ! -z "$TEST_EXECUTION_LINES" ]; then
              INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n\n**Test Execution Progress:**"
              
              # Extract test numbers that passed
              EXECUTION_PROGRESS=$(echo "$TEST_EXECUTION_LINES" | tail -20)
              while IFS= read -r exec_line; do
                if [ ! -z "$exec_line" ]; then
                  EXEC_COUNT=$(echo "$exec_line" | grep -oE "Executed [0-9]+" | grep -oE "[0-9]+")
                  if [ ! -z "$EXEC_COUNT" ] && [ "$EXEC_COUNT" -gt 0 ]; then
                    INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n  ✅ Test #$EXEC_COUNT completed successfully"
                  fi
                fi
              done <<< "$EXECUTION_PROGRESS"
            fi
            
            # Parse test descriptions if available
            if [ ! -z "$SPEC_TESTS" ]; then
              INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n\n**Individual Test Cases:**"
              while IFS= read -r test_desc; do
                if [ ! -z "$test_desc" ]; then
                  # Clean up test description
                  CLEAN_DESC=$(echo "$test_desc" | sed 's/should //' | sed 's/^[[:space:]]*//' | head -c 80)
                  if [ ! -z "$CLEAN_DESC" ]; then
                    INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n  ✅ $CLEAN_DESC"
                  fi
                fi
              done <<< "$SPEC_TESTS"
            fi
            
            # If we have specific test files, list them with estimated test counts
            SPEC_REFERENCES=$(grep -oE "src/app/[^/]+/[^/]+\.spec\.ts" test_results.txt | sort | uniq || echo "")
            if [ ! -z "$SPEC_REFERENCES" ]; then
              INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n\n**Test Files with Results:**"
              while IFS= read -r spec_file; do
                if [ ! -z "$spec_file" ]; then
                  SPEC_NAME=$(basename "$spec_file")
                  # Try to count tests in this spec file from output
                  SPEC_COUNT=$(grep -c "$SPEC_NAME" test_results.txt || echo "1")
                  INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n  📄 **$SPEC_NAME** - ~$SPEC_COUNT test(s) ✅"
                fi
              done <<< "$SPEC_REFERENCES"
            fi
            
            # Look for any failed test specifics
            if [ "$FAILED_TESTS" -gt 0 ]; then
              FAILED_SPECIFIC=$(grep -E "FAILED.*should|✗.*should|×.*should" test_results.txt | head -10 || echo "")
              if [ ! -z "$FAILED_SPECIFIC" ]; then
                INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n\n**Failed Test Details:**"
                while IFS= read -r failed_test; do
                  if [ ! -z "$failed_test" ]; then
                    FAILED_DESC=$(echo "$failed_test" | sed 's/.*should /should /' | sed 's/Chrome.*//' | head -c 100)
                    INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n  ❌ $FAILED_DESC"
                  fi
                done <<< "$FAILED_SPECIFIC"
              fi
            fi
            
            # Fallback: Create detailed summary based on execution counts
            if [[ "$INDIVIDUAL_TESTS" == "📊 **Individual Test Results:**" ]]; then
              INDIVIDUAL_TESTS="📊 **Test Execution Summary:**"
              INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n\n**Results by Category:**"
              
              # Count tests by service/component type based on error patterns
              AUTH_TESTS=$(grep -c "auth\|Auth" test_results.txt || echo "0")
              VACATION_TESTS=$(grep -c "vacation\|Vacation" test_results.txt || echo "0")
              TIME_TESTS=$(grep -c "time\|Time" test_results.txt || echo "0")
              COMPONENT_TESTS=$(grep -c "Component\|component" test_results.txt || echo "0")
              SERVICE_TESTS=$(grep -c "Service\|service" test_results.txt || echo "0")
              
              if [ "$AUTH_TESTS" -gt 0 ]; then
                INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n  🔐 Authentication Tests: $AUTH_TESTS tests ✅"
              fi
              if [ "$VACATION_TESTS" -gt 0 ]; then
                INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n  🏖️ Vacation Tests: $VACATION_TESTS tests ✅"
              fi
              if [ "$TIME_TESTS" -gt 0 ]; then
                INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n  ⏰ Time Entry Tests: $TIME_TESTS tests ✅"
              fi
              if [ "$COMPONENT_TESTS" -gt 0 ]; then
                INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n  🧩 Component Tests: $COMPONENT_TESTS tests ✅"
              fi
              if [ "$SERVICE_TESTS" -gt 0 ]; then
                INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n  ⚙️ Service Tests: $SERVICE_TESTS tests ✅"
              fi
              
              # Add generic test list based on passed count
              if [ "$PASSED_TESTS" -gt 0 ]; then
                INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n\n**All Tests Status:**"
                for i in $(seq 1 $PASSED_TESTS); do
                  INDIVIDUAL_TESTS="$INDIVIDUAL_TESTS\n  ✅ Test #$i - PASSED"
                done
              fi
            fi
            
            # Create test result summary
            if [ "$PASSED_TESTS" -gt 0 ]; then
              PASSED_TEST_DETAILS="✅ $PASSED_TESTS tests passed successfully"
            fi
            
            if [ "$FAILED_TESTS" -gt 0 ]; then
              FAILED_TEST_DETAILS="❌ $FAILED_TESTS tests failed"
            fi
            
            # Look for failed test names with different patterns
            if [ "$FAILED_TESTS" = "0" ]; then
              FAILED_TEST_NAMES="No failed tests"
            else
              # Only capture actual test failures, not console errors
              FAILED_TEST_NAMES=$(grep -E "FAILED.*spec|✗.*spec|×.*spec|SPEC HAS NO EXPECTATIONS" test_results.txt | head -10 | sed 's/^[[:space:]]*/- /' || echo "No specific test failure details found")
            fi
            
            # Debug output
            echo "Parsing results:"
            echo "  Total tests found: $TOTAL_TESTS"
            echo "  Failed tests found: $FAILED_TESTS"
            echo "  Passed tests calculated: $PASSED_TESTS"
            
            # Set outputs
            echo "total_tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
            echo "passed_tests=$PASSED_TESTS" >> $GITHUB_OUTPUT
            echo "failed_tests=$FAILED_TESTS" >> $GITHUB_OUTPUT
            echo "failed_test_names<<EOF" >> $GITHUB_OUTPUT
            echo "$FAILED_TEST_NAMES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            
            echo "individual_tests<<EOF" >> $GITHUB_OUTPUT
            echo -e "$INDIVIDUAL_TESTS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            
            echo "passed_test_details<<EOF" >> $GITHUB_OUTPUT
            echo -e "$PASSED_TEST_DETAILS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            
            echo "failed_test_details<<EOF" >> $GITHUB_OUTPUT
            echo -e "$FAILED_TEST_DETAILS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "No test_results.txt file found"
            echo "total_tests=0" >> $GITHUB_OUTPUT
            echo "passed_tests=0" >> $GITHUB_OUTPUT
            echo "failed_tests=0" >> $GITHUB_OUTPUT
            echo "failed_test_names=No test results file found" >> $GITHUB_OUTPUT
            echo "individual_tests=No test results to parse" >> $GITHUB_OUTPUT
            echo "passed_test_details=No test results" >> $GITHUB_OUTPUT
            echo "failed_test_details=No test results" >> $GITHUB_OUTPUT
          fi
        
      - name: Create test report issue
        uses: actions/github-script@v7
        with:
          script: |
            const testExitCode = '${{ steps.test_run.outputs.test_exit_code }}';
            const totalTests = '${{ steps.parse_results.outputs.total_tests }}';
            const passedTests = '${{ steps.parse_results.outputs.passed_tests }}';
            const failedTests = '${{ steps.parse_results.outputs.failed_tests }}';
            
            // Safely handle test details with proper escaping
            const failedTestNames = `${{ steps.parse_results.outputs.failed_test_names }}`.replace(/[\\"'`]/g, ' ');
            const individualTests = `${{ steps.parse_results.outputs.individual_tests }}`.replace(/[\\"'`]/g, ' ');
            const passedTestDetails = `${{ steps.parse_results.outputs.passed_test_details }}`.replace(/[\\"'`]/g, ' ');
            const failedTestDetails = `${{ steps.parse_results.outputs.failed_test_details }}`.replace(/[\\"'`]/g, ' ');
            
            const success = testExitCode === '0';
            const status = success ? '✅ SUCCESS' : '❌ FAILURE';
            const emoji = success ? '🎉' : '🚨';
            
            const title = emoji + ' Nightly Test Report - ' + new Date().toISOString().split('T')[0] + ' - ' + status;
            
            let body = '## Nightly Test Execution Report\n\n';
            body += '**Date:** ' + new Date().toLocaleString() + '\n';
            body += '**Status:** ' + status + '\n';
            body += '**Branch:** ' + context.ref.replace('refs/heads/', '') + '\n';
            body += '**Commit:** ' + context.sha.substring(0, 7) + '\n\n';
            
            // Summary section
            body += '### 📊 Test Summary\n';
            body += '- **Total Tests:** ' + totalTests + '\n';
            body += '- **Passed:** ' + passedTests + ' ✅\n';
            body += '- **Failed:** ' + failedTests + ' ❌\n\n';
            
            // Individual test details
            if (individualTests && individualTests !== 'No test results to parse') {
              body += '### 📋 Individual Test Results\n';
              body += individualTests + '\n';
              
              if (passedTestDetails && passedTestDetails !== 'No test results') {
                body += '\n**Passed Tests:**\n' + passedTestDetails + '\n';
              }
              
              if (failedTestDetails && failedTestDetails !== 'No test results' && parseInt(failedTests) > 0) {
                body += '\n**Failed Tests:**\n' + failedTestDetails + '\n';
              }
              body += '\n';
            }
            
            // Failed test names (if any)
            if (parseInt(failedTests) > 0 && failedTestNames !== 'No failed tests') {
              body += '### 🚨 Failed Test Details\n';
              body += failedTestNames + '\n\n';
            }
            
            body += '### 🔗 Actions\n';
            body += '- [View workflow run](' + context.payload.repository.html_url + '/actions/runs/' + context.runId + ')\n';
            body += '- [View repository](' + context.payload.repository.html_url + ')\n\n';
            body += '---\n*This report was automatically generated by the nightly test workflow.*';
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: success ? ['automated-test', 'success'] : ['automated-test', 'test-failure', 'bug']
            });
        
      - name: Parse console warnings
        id: parse_warnings
        run: |
          if [ -f test_results.txt ]; then
            # Extract console errors/warnings that aren't test failures
            CONSOLE_WARNINGS=$(grep -E "ERROR:|TypeError:|Error:" test_results.txt | head -5 | sed 's/^[[:space:]]*/- /' || echo "No console warnings found")
            echo "console_warnings<<EOF" >> $GITHUB_OUTPUT
            echo "$CONSOLE_WARNINGS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "console_warnings=No test output to analyze" >> $GITHUB_OUTPUT
          fi

      - name: Send email notification (optional)
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ steps.test_run.outputs.test_exit_code == '0' && '✅' || '❌' }} Nightly Test Report - ${{ github.repository }}"
          body: |
            🌙 Nightly test execution completed.
            
            📊 SUMMARY:
            Status: ${{ steps.test_run.outputs.test_exit_code == '0' && 'SUCCESS ✅' || 'FAILURE ❌' }}
            Total Tests: ${{ steps.parse_results.outputs.total_tests }}
            Passed: ${{ steps.parse_results.outputs.passed_tests }} ✅
            Failed: ${{ steps.parse_results.outputs.failed_tests }} ❌
            
            📋 INDIVIDUAL TEST RESULTS:
            ${{ steps.parse_results.outputs.individual_tests }}
            
            ${{ steps.parse_results.outputs.passed_tests != '0' && 'PASSED TESTS:' || '' }}
            ${{ steps.parse_results.outputs.passed_test_details }}
            
            ${{ steps.parse_results.outputs.failed_tests != '0' && 'FAILED TESTS:' || '' }}
            ${{ steps.parse_results.outputs.failed_test_details }}
            
            ${{ steps.parse_results.outputs.failed_tests != '0' && 'FAILURE DETAILS:' || '' }}
            ${{ steps.parse_results.outputs.failed_tests != '0' && steps.parse_results.outputs.failed_test_names || '' }}
            
            ⚠️ Console Warnings/Errors (not test failures):
            ${{ steps.parse_warnings.outputs.console_warnings }}
            
            🔗 View full report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions <noreply@github.com>
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
  
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' 
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Angular app
        run: npm run build -- --configuration=github-pages
        
      - name: Copy index.html to 404.html for GitHub Pages routing
        run: cp ./dist/tt-project/browser/index.html ./dist/tt-project/browser/404.html
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/tt-project/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' 
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
