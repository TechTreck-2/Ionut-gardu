name: Deploy to GitHub Pages

on:
  push:
    branches: [ Ionut-Gardu ]  
  pull_request:
    branches: [ Ionut-Gardu ] 
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write


concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  nightly-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests with coverage
        id: test_run
        run: |
          npm test -- --watch=false --browsers=ChromeHeadless --code-coverage > test_results.txt 2>&1
          echo "test_exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
        
      - name: Parse test results
        id: parse_results
        run: |
          if [ -f test_results.txt ]; then
            TOTAL_TESTS=$(grep -o '[0-9]* tests completed' test_results.txt | head -1 | grep -o '[0-9]*' || echo "0")
            FAILED_TESTS=$(grep -o '[0-9]* FAILED' test_results.txt | grep -o '[0-9]*' || echo "0")
            PASSED_TESTS=$((TOTAL_TESTS - FAILED_TESTS))
            
            FAILED_TEST_NAMES=$(grep -A 5 "FAILED TESTS:" test_results.txt | grep "✗" | sed 's/.*✗ /- /' || echo "No failed tests")
            
            echo "total_tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
            echo "passed_tests=$PASSED_TESTS" >> $GITHUB_OUTPUT
            echo "failed_tests=$FAILED_TESTS" >> $GITHUB_OUTPUT
            echo "failed_test_names<<EOF" >> $GITHUB_OUTPUT
            echo "$FAILED_TEST_NAMES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "total_tests=0" >> $GITHUB_OUTPUT
            echo "passed_tests=0" >> $GITHUB_OUTPUT
            echo "failed_tests=0" >> $GITHUB_OUTPUT
            echo "failed_test_names=No test results found" >> $GITHUB_OUTPUT
          fi
        
      - name: Create test report issue
        uses: actions/github-script@v7
        with:
          script: |
            const testExitCode = '${{ steps.test_run.outputs.test_exit_code }}';
            const totalTests = '${{ steps.parse_results.outputs.total_tests }}';
            const passedTests = '${{ steps.parse_results.outputs.passed_tests }}';
            const failedTests = '${{ steps.parse_results.outputs.failed_tests }}';
            const failedTestNames = '${{ steps.parse_results.outputs.failed_test_names }}';
            
            const success = testExitCode === '0';
            const status = success ? '✅ SUCCESS' : '❌ FAILURE';
            const emoji = success ? '🎉' : '🚨';
            
            const title = emoji + ' Nightly Test Report - ' + new Date().toISOString().split('T')[0] + ' - ' + status;
            
            let body = '## Nightly Test Execution Report\n\n';
            body += '**Date:** ' + new Date().toLocaleString() + '\n';
            body += '**Status:** ' + status + '\n';
            body += '**Branch:** ' + context.ref.replace('refs/heads/', '') + '\n';
            body += '**Commit:** ' + context.sha.substring(0, 7) + '\n\n';
            body += '### Test Summary\n';
            body += '- **Total Tests:** ' + totalTests + '\n';
            body += '- **Passed:** ' + passedTests + '\n';
            body += '- **Failed:** ' + failedTests + '\n';
            
            if (failedTests > 0) {
              body += '\n### Failed Tests\n' + failedTestNames + '\n';
            }
            
            body += '\n### Actions\n';
            body += '- [View workflow run](' + context.payload.repository.html_url + '/actions/runs/' + context.runId + ')\n';
            body += '- [View repository](' + context.payload.repository.html_url + ')\n\n';
            body += '---\n*This report was automatically generated by the nightly test workflow.*';
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: success ? ['automated-test', 'success'] : ['automated-test', 'test-failure', 'bug']
            });
        
      - name: Send email notification (optional)
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ steps.test_run.outputs.test_exit_code == '0' && '✅' || '❌' }} Nightly Test Report - ${{ github.repository }}"
          body: |
            Nightly test execution completed.
            
            Status: ${{ steps.test_run.outputs.test_exit_code == '0' && 'SUCCESS' || 'FAILURE' }}
            Total Tests: ${{ steps.parse_results.outputs.total_tests }}
            Passed: ${{ steps.parse_results.outputs.passed_tests }}
            Failed: ${{ steps.parse_results.outputs.failed_tests }}
            
            ${{ steps.parse_results.outputs.failed_tests != '0' && 'Failed Tests:' || '' }}
            ${{ steps.parse_results.outputs.failed_test_names }}
            
            View full report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions <noreply@github.com>
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
  
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'  
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Angular app
        run: npm run build -- --configuration=github-pages
        
      - name: Copy index.html to 404.html for GitHub Pages routing
        run: cp ./dist/tt-project/browser/index.html ./dist/tt-project/browser/404.html
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/tt-project/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'  
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
